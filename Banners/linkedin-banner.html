<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #07111f;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      position: relative;
    }
    @keyframes scan {
      0%   { top: -80px; }
      100% { top: 396px; }
    }
    .scanline {
      position: absolute;
      left: 0; right: 0;
      height: 80px;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 200, 255, 0.04) 50%,
        transparent 100%
      );
      animation: scan 7s linear infinite;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.85; }
      50%       { opacity: 0.4;  }
    }
    .pulse { animation: pulse-dot 3s ease-in-out infinite; }
  </style>
</head>
<body>
<div class="scanline"></div>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#07111f"/>
      <stop offset="40%"  stop-color="#0c1d35"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>

    <!-- Radial glow behind text -->
    <radialGradient id="glow" cx="50%" cy="50%" r="35%">
      <stop offset="0%"   stop-color="#1a3a6e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#07111f"  stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle dot grid pattern -->
    <pattern id="dotgrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.85" fill="#4a9abe" opacity="0.22"/>
    </pattern>

    <!-- Name text glow -->
    <filter id="text-glow" x="-15%" y="-60%" width="130%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Accent dot glow -->
    <filter id="dot-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>
  <rect width="1584" height="396" fill="url(#dotgrid)"/>

  <!-- ── Bottom accent line ── -->
  <line x1="0" y1="393" x2="1584" y2="393" stroke="#00c8ff" stroke-width="2.5" opacity="0.85"/>

  <!-- ════════════════════════════
       LEFT GEOMETRY
       ════════════════════════════ -->
  <!-- Outer pulse ring (very faint) -->
  <circle cx="205" cy="198" r="170" fill="none" stroke="#1a8cb5" stroke-width="0.5" opacity="0.15"/>
  <!-- Main circle -->
  <circle cx="205" cy="198" r="148" fill="none" stroke="#1a8cb5" stroke-width="1.2" opacity="0.55"/>
  <!-- Inner ring -->
  <circle cx="205" cy="198" r="118" fill="none" stroke="#1a8cb5" stroke-width="0.6" opacity="0.25"/>
  <!-- Inscribed triangle -->
  <polygon points="205,50  334,272  76,272"
    fill="none" stroke="#1a8cb5" stroke-width="1.2" opacity="0.55"/>
  <!-- Vertex dots (glowing) -->
  <circle cx="205" cy="50"  r="3.5" fill="#00c8ff" opacity="0.85" filter="url(#dot-glow)"/>
  <circle cx="334" cy="272" r="3.5" fill="#00c8ff" opacity="0.85" filter="url(#dot-glow)"/>
  <circle cx="76"  cy="272" r="3.5" fill="#00c8ff" opacity="0.85" filter="url(#dot-glow)"/>
  <circle cx="340" cy="130" r="2.5" fill="#00c8ff" opacity="0.6"/>

  <!-- ════════════════════════════
       RIGHT GEOMETRY — Hexagons
       ════════════════════════════ -->
  <polygon points="1370,60  1415,85  1415,135  1370,160  1325,135  1325,85"
    fill="none" stroke="#1a8cb5" stroke-width="1.3" opacity="0.55"/>
  <circle cx="1370" cy="60"  r="2.8" fill="#00c8ff" opacity="0.75" filter="url(#dot-glow)"/>
  <circle cx="1415" cy="110" r="2.8" fill="#00c8ff" opacity="0.6"/>

  <polygon points="1460,140  1495,160  1495,200  1460,220  1425,200  1425,160"
    fill="none" stroke="#1a8cb5" stroke-width="1.1" opacity="0.45"/>
  <circle cx="1495" cy="180" r="2.2" fill="#00c8ff" opacity="0.65"/>

  <polygon points="1380,240  1405,254  1405,282  1380,296  1355,282  1355,254"
    fill="none" stroke="#1a8cb5" stroke-width="1.0" opacity="0.40"/>

  <polygon points="1490,60  1508,70  1508,90  1490,100  1472,90  1472,70"
    fill="none" stroke="#1a8cb5" stroke-width="0.9" opacity="0.30"/>

  <!-- ════════════════════════════
       NETWORK LINES (dot connections)
       ════════════════════════════ -->
  <!-- Top row -->
  <line x1="500" y1="48"  x2="820"  y2="30"  stroke="#00c8ff" stroke-width="0.55" opacity="0.18"/>
  <line x1="820" y1="30"  x2="1100" y2="55"  stroke="#00c8ff" stroke-width="0.55" opacity="0.18"/>
  <!-- Bottom row -->
  <line x1="430"  y1="310" x2="650"  y2="355" stroke="#00c8ff" stroke-width="0.5"  opacity="0.15"/>
  <line x1="650"  y1="355" x2="950"  y2="370" stroke="#00c8ff" stroke-width="0.5"  opacity="0.15"/>
  <line x1="950"  y1="370" x2="1230" y2="320" stroke="#00c8ff" stroke-width="0.5"  opacity="0.15"/>
  <line x1="1090" y1="340" x2="1230" y2="320" stroke="#00c8ff" stroke-width="0.4"  opacity="0.12"/>

  <!-- ════════════════════════════
       SCATTERED ACCENT DOTS
       ════════════════════════════ -->
  <circle cx="500"  cy="48"  r="2.2" fill="#00c8ff" opacity="0.55"/>
  <circle cx="820"  cy="30"  r="1.8" fill="#00c8ff" opacity="0.45"/>
  <circle cx="1100" cy="55"  r="2.0" fill="#00c8ff" opacity="0.50"/>
  <circle cx="650"  cy="355" r="1.8" fill="#00c8ff" opacity="0.40"/>
  <circle cx="950"  cy="370" r="2.2" fill="#00c8ff" opacity="0.45"/>
  <circle cx="1230" cy="320" r="1.8" fill="#00c8ff" opacity="0.40"/>
  <circle cx="430"  cy="310" r="1.6" fill="#00c8ff" opacity="0.35"/>
  <circle cx="1090" cy="340" r="1.6" fill="#00c8ff" opacity="0.35"/>
  <circle cx="74"   cy="80"  r="3.0" fill="#00c8ff" opacity="0.70" filter="url(#dot-glow)"/>

  <!-- ════════════════════════════
       CORNER HUD BRACKETS
       ════════════════════════════ -->
  <!-- Top-left -->
  <polyline points="18,62 18,18 64,18"
    fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="square" opacity="0.65"/>
  <circle cx="18" cy="18" r="2.5" fill="#00c8ff" opacity="0.75"/>
  <!-- Top-right -->
  <polyline points="1520,18 1566,18 1566,62"
    fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="square" opacity="0.65"/>
  <circle cx="1566" cy="18" r="2.5" fill="#00c8ff" opacity="0.75"/>
  <!-- Bottom-left -->
  <polyline points="18,334 18,378 64,378"
    fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="square" opacity="0.65"/>
  <circle cx="18" cy="378" r="2.5" fill="#00c8ff" opacity="0.75"/>
  <!-- Bottom-right -->
  <polyline points="1520,378 1566,378 1566,334"
    fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="square" opacity="0.65"/>
  <circle cx="1566" cy="378" r="2.5" fill="#00c8ff" opacity="0.75"/>

  <!-- ════════════════════════════
       SOC ANALYST BADGE (top center)
       ════════════════════════════ -->
  <rect x="726" y="15" width="132" height="24" rx="2"
    fill="none" stroke="#00c8ff" stroke-width="0.9" opacity="0.55"/>
  <!-- Corner tick marks on badge -->
  <line x1="726" y1="22" x2="726" y2="15" stroke="#00c8ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="726" y1="15" x2="733" y2="15" stroke="#00c8ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="858" y1="15" x2="858" y2="22" stroke="#00c8ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="851" y1="15" x2="858" y2="15" stroke="#00c8ff" stroke-width="1.5" opacity="0.7"/>
  <text x="792" y="31.5" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="10.5" font-weight="600" fill="#00c8ff" letter-spacing="2.8" opacity="0.85">
    SOC ANALYST
  </text>

  <!-- ════════════════════════════
       TEXT — Name (with glow)
       ════════════════════════════ -->
  <text x="792" y="185" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="72" font-weight="700" fill="#ffffff" letter-spacing="1"
    filter="url(#text-glow)">Santiago A. Ruiz Diaz</text>

  <!-- Underline accent -->
  <line x1="572" y1="196" x2="1012" y2="196" stroke="#00c8ff" stroke-width="1.8" opacity="0.70"/>

  <!-- ════════════════════════════
       TEXT — Specialty tags
       ════════════════════════════ -->
  <text x="792" y="247" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="17" font-weight="600" fill="#00c8ff" letter-spacing="2.8">
    SECURITY OPERATIONS · STIG COMPLIANCE · VULNERABILITY MANAGEMENT · CLOUD SECURITY
  </text>

  <!-- ════════════════════════════
       TEXT — Tools line
       ════════════════════════════ -->
  <text x="792" y="291" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="18" font-weight="400" fill="#c8dff0" letter-spacing="1.5">
    PowerShell · Microsoft Sentinel · Defender for Endpoint · Tenable · Azure
  </text>
</svg>
</body>
</html>
