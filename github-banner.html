<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px;
      height: 400px;
      overflow: hidden;
      background: #07111f;
      position: relative;
    }
    @keyframes scan {
      0%   { top: -80px; }
      100% { top: 410px; }
    }
    .scanline {
      position: absolute;
      left: 0; right: 0;
      height: 80px;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 200, 255, 0.04) 50%,
        transparent 100%
      );
      animation: scan 7s linear infinite;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
<div class="scanline"></div>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#07111f"/>
      <stop offset="45%"  stop-color="#0c1d35"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="centerglow" cx="50%" cy="52%" r="38%">
      <stop offset="0%"   stop-color="#1a3a6e" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#07111f"  stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotgrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.85" fill="#4a9abe" opacity="0.22"/>
    </pattern>
    <!-- Name glow -->
    <filter id="text-glow" x="-15%" y="-60%" width="130%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Accent dot glow -->
    <filter id="dot-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Badge glow -->
    <filter id="badge-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#centerglow)"/>
  <rect width="1280" height="400" fill="url(#dotgrid)"/>

  <!-- Bottom accent line -->
  <line x1="0" y1="397" x2="1280" y2="397" stroke="#00c8ff" stroke-width="2.5" opacity="0.85"/>
  <!-- Top accent line (thinner) -->
  <line x1="0" y1="3" x2="1280" y2="3" stroke="#00c8ff" stroke-width="1.0" opacity="0.35"/>

  <!-- ════════════════════
       LEFT GEOMETRY
       ════════════════════ -->
  <circle cx="170" cy="200" r="152" fill="none" stroke="#1a8cb5" stroke-width="0.5" opacity="0.15"/>
  <circle cx="170" cy="200" r="130" fill="none" stroke="#1a8cb5" stroke-width="1.2" opacity="0.50"/>
  <circle cx="170" cy="200" r="100" fill="none" stroke="#1a8cb5" stroke-width="0.6" opacity="0.22"/>
  <!-- Inscribed triangle -->
  <polygon points="170,70  292,265  48,265"
    fill="none" stroke="#1a8cb5" stroke-width="1.2" opacity="0.52"/>
  <!-- Vertex dots -->
  <circle cx="170" cy="70"  r="3.5" fill="#00c8ff" opacity="0.85" filter="url(#dot-glow)"/>
  <circle cx="292" cy="265" r="3.5" fill="#00c8ff" opacity="0.85" filter="url(#dot-glow)"/>
  <circle cx="48"  cy="265" r="3.5" fill="#00c8ff" opacity="0.85" filter="url(#dot-glow)"/>
  <circle cx="295" cy="135" r="2.5" fill="#00c8ff" opacity="0.55"/>
  <!-- Center crosshair dot -->
  <circle cx="170" cy="200" r="3.0" fill="none" stroke="#00c8ff" stroke-width="1.0" opacity="0.40"/>
  <circle cx="170" cy="200" r="1.2" fill="#00c8ff" opacity="0.50"/>

  <!-- ════════════════════
       RIGHT GEOMETRY — Hexagons
       ════════════════════ -->
  <polygon points="1112,52  1153,75  1153,121  1112,144  1071,121  1071,75"
    fill="none" stroke="#1a8cb5" stroke-width="1.3" opacity="0.55"/>
  <circle cx="1112" cy="52"  r="2.8" fill="#00c8ff" opacity="0.75" filter="url(#dot-glow)"/>
  <circle cx="1153" cy="98"  r="2.5" fill="#00c8ff" opacity="0.55"/>

  <polygon points="1196,128  1228,147  1228,183  1196,202  1164,183  1164,147"
    fill="none" stroke="#1a8cb5" stroke-width="1.1" opacity="0.45"/>
  <circle cx="1228" cy="165" r="2.2" fill="#00c8ff" opacity="0.60"/>

  <polygon points="1108,230  1130,243  1130,268  1108,281  1086,268  1086,243"
    fill="none" stroke="#1a8cb5" stroke-width="1.0" opacity="0.38"/>

  <polygon points="1218,52  1236,62  1236,82  1218,92  1200,82  1200,62"
    fill="none" stroke="#1a8cb5" stroke-width="0.9" opacity="0.28"/>

  <!-- ════════════════════
       NETWORK LINES
       ════════════════════ -->
  <line x1="390" y1="42"  x2="660"  y2="26"  stroke="#00c8ff" stroke-width="0.55" opacity="0.17"/>
  <line x1="660" y1="26"  x2="900"  y2="48"  stroke="#00c8ff" stroke-width="0.55" opacity="0.17"/>
  <line x1="340" y1="318" x2="580"  y2="358" stroke="#00c8ff" stroke-width="0.5"  opacity="0.14"/>
  <line x1="580" y1="358" x2="820"  y2="372" stroke="#00c8ff" stroke-width="0.5"  opacity="0.14"/>
  <line x1="820" y1="372" x2="1010" y2="330" stroke="#00c8ff" stroke-width="0.5"  opacity="0.14"/>

  <!-- ════════════════════
       SCATTERED DOTS
       ════════════════════ -->
  <circle cx="390"  cy="42"  r="2.0" fill="#00c8ff" opacity="0.50"/>
  <circle cx="660"  cy="26"  r="1.8" fill="#00c8ff" opacity="0.42"/>
  <circle cx="900"  cy="48"  r="2.0" fill="#00c8ff" opacity="0.48"/>
  <circle cx="340"  cy="318" r="1.6" fill="#00c8ff" opacity="0.35"/>
  <circle cx="580"  cy="358" r="1.8" fill="#00c8ff" opacity="0.38"/>
  <circle cx="820"  cy="372" r="2.0" fill="#00c8ff" opacity="0.42"/>
  <circle cx="1010" cy="330" r="1.6" fill="#00c8ff" opacity="0.35"/>
  <circle cx="60"   cy="78"  r="3.0" fill="#00c8ff" opacity="0.65" filter="url(#dot-glow)"/>
  <circle cx="1050" cy="55"  r="1.8" fill="#00c8ff" opacity="0.40"/>

  <!-- ════════════════════
       CORNER HUD BRACKETS
       ════════════════════ -->
  <polyline points="18,62 18,18 64,18" fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="square" opacity="0.65"/>
  <circle cx="18" cy="18" r="2.5" fill="#00c8ff" opacity="0.75"/>
  <polyline points="1216,18 1262,18 1262,62" fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="square" opacity="0.65"/>
  <circle cx="1262" cy="18" r="2.5" fill="#00c8ff" opacity="0.75"/>
  <polyline points="18,338 18,382 64,382" fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="square" opacity="0.65"/>
  <circle cx="18" cy="382" r="2.5" fill="#00c8ff" opacity="0.75"/>
  <polyline points="1216,382 1262,382 1262,338" fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="square" opacity="0.65"/>
  <circle cx="1262" cy="382" r="2.5" fill="#00c8ff" opacity="0.75"/>

  <!-- ════════════════════
       OPEN TO WORK BADGE
       ════════════════════ -->
  <!-- Pill-shaped badge -->
  <rect x="560" y="52" width="160" height="26" rx="13"
    fill="#00c8ff" fill-opacity="0.12" stroke="#00c8ff" stroke-width="1.0" opacity="0.80"
    filter="url(#badge-glow)"/>
  <!-- Pulsing dot on badge -->
  <circle cx="578" cy="65" r="4" fill="#00c8ff" opacity="0.90" filter="url(#dot-glow)"/>
  <circle cx="578" cy="65" r="2" fill="#ffffff" opacity="0.95"/>
  <text x="648" y="69.5" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="11" font-weight="700" fill="#00c8ff" letter-spacing="2.2" opacity="0.95">
    OPEN TO WORK
  </text>

  <!-- ════════════════════
       NAME
       ════════════════════ -->
  <text x="640" y="190" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="68" font-weight="700" fill="#ffffff" letter-spacing="1"
    filter="url(#text-glow)">Santiago A. Ruiz Diaz</text>

  <!-- Underline -->
  <line x1="365" y1="200" x2="915" y2="200" stroke="#00c8ff" stroke-width="1.8" opacity="0.65"/>

  <!-- ════════════════════
       TITLE
       ════════════════════ -->
  <text x="640" y="237" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="20" font-weight="600" fill="#00c8ff" letter-spacing="5.5">
    SECURITY ENGINEER
  </text>

  <!-- ════════════════════
       SKILLS LINE
       ════════════════════ -->
  <text x="640" y="278" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#a8c8e8" letter-spacing="1.8">
    STIG Compliance · Vulnerability Management · Threat Hunting · Cloud Security
  </text>

  <!-- ════════════════════
       TOOLS LINE
       ════════════════════ -->
  <text x="640" y="316" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="14.5" font-weight="400" fill="#7090b0" letter-spacing="1.2">
    PowerShell · Microsoft Sentinel · Defender for Endpoint · Tenable · Azure
  </text>
</svg>
</body>
</html>
